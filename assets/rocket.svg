<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Animated cartoon rocket divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0F3D66"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="110" rx="16"/></clipPath>
  </defs>

  <style>
    .o{transform-box:fill-box;transform-origin:center}
    .tw{animation:tw 2.4s ease-in-out infinite}
    .fly{animation:fly 9s linear infinite}
    .wave{animation:wave 1.8s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:right center;animation:flick .18s ease-in-out infinite alternate}
    .puff{transform-box:fill-box;transform-origin:center;animation:puff 1.2s ease-out infinite}
    .planet{animation:bob 5s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes fly{from{transform:translateX(-170px)}to{transform:translateX(1070px)}}
    @keyframes wave{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
    @keyframes flick{from{transform:scaleX(.7)}to{transform:scaleX(1.15)}}
    @keyframes puff{0%{opacity:.5;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="110" fill="url(#bg)"/>

    <g fill="#FFFFFF">
      <circle class="tw" cx="40" cy="20" r="1.8" style="animation-delay:0s"/>
      <circle class="tw" cx="130" cy="86" r="1.5" style="animation-delay:.5s"/>
      <circle class="tw" cx="240" cy="30" r="1.8" style="animation-delay:1.1s"/>
      <circle class="tw" cx="330" cy="90" r="1.5" style="animation-delay:.3s"/>
      <circle class="tw" cx="450" cy="18" r="1.8" style="animation-delay:1.6s"/>
      <circle class="tw" cx="560" cy="84" r="1.5" style="animation-delay:.9s"/>
      <circle class="tw" cx="660" cy="26" r="1.8" style="animation-delay:1.3s"/>
      <circle class="tw" cx="760" cy="92" r="1.5" style="animation-delay:.2s"/>
      <circle class="tw" cx="860" cy="22" r="1.8" style="animation-delay:1.8s"/>
    </g>

    <!-- planets -->
    <g class="planet">
      <circle cx="760" cy="40" r="16" fill="#FF9800"/>
      <ellipse cx="760" cy="40" rx="28" ry="6" fill="none" stroke="#FFC107" stroke-width="3" transform="rotate(-18 760 40)"/>
    </g>
    <g class="planet" style="animation-delay:-2s">
      <circle cx="150" cy="38" r="11" fill="#00C9FF"/>
      <circle cx="146" cy="34" r="3" fill="#FFFFFF" fill-opacity=".5"/>
    </g>

    <!-- rocket -->
    <g transform="translate(0,55)">
      <g class="fly">
        <g class="wave">
          <circle class="puff" cx="-84" cy="0" r="7" fill="#FFFFFF" style="animation-delay:0s"/>
          <circle class="puff" cx="-100" cy="3" r="9" fill="#FFFFFF" style="animation-delay:.4s"/>
          <circle class="puff" cx="-118" cy="-2" r="7" fill="#FFFFFF" style="animation-delay:.8s"/>
          <g class="flame">
            <path d="M-40,-9 Q-80,0 -40,9 Z" fill="#FF9800"/>
            <path d="M-40,-5 Q-62,0 -40,5 Z" fill="#FFC107"/>
          </g>
          <path d="M-38,-14 L-58,-31 L-18,-14 Z" fill="#FF5252"/>
          <path d="M-38,14 L-58,31 L-18,14 Z" fill="#FF5252"/>
          <path d="M-40,-14 L12,-14 C38,-14 56,-6 62,0 C56,6 38,14 12,14 L-40,14 Z" fill="#F5F9FF"/>
          <rect x="-28" y="-14" width="7" height="28" fill="#FF9800"/>
          <path d="M24,-13 C42,-11 56,-5 62,0 C56,5 42,11 24,13 C33,6 33,-6 24,-13 Z" fill="#FF5252"/>
          <circle cx="-4" cy="0" r="8" fill="#00C9FF" stroke="#0B1F3A" stroke-width="3"/>
          <circle cx="-6.5" cy="-2.5" r="2.2" fill="#FFFFFF"/>
        </g>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
