<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Ancient Egyptian ankh divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fading lines -->
  <rect x="40" y="21" width="380" height="2" fill="url(#fadeL)"/>
  <rect x="580" y="21" width="380" height="2" fill="url(#fadeR)"/>

  <!-- diamonds -->
  <g fill="#30D5C8">
    <rect x="428" y="18" width="8" height="8" transform="rotate(45 432 22)"/>
    <rect x="564" y="18" width="8" height="8" transform="rotate(45 568 22)"/>
  </g>
  <g fill="#B5361C">
    <rect x="450" y="19" width="6" height="6" transform="rotate(45 453 22)"/>
    <rect x="544" y="19" width="6" height="6" transform="rotate(45 547 22)"/>
  </g>

  <!-- ankh -->
  <g stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" fill="none">
    <ellipse cx="500" cy="12" rx="7" ry="9"/>
    <path d="M500 21 V40"/>
    <path d="M489 27 H511"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
