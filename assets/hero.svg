<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Zeinab Diab - ancient Egypt themed header featuring Ramses II" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0704"/>
      <stop offset="0.65" stop-color="#26170A"/>
      <stop offset="1" stop-color="#5A3A14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B3"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6D1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nemes" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1E4E8C"/>
      <rect y="4" width="8" height="3" fill="#D4AF37"/>
    </pattern>
    <pattern id="band" width="40" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#0F8B7D"/>
      <rect x="10" width="10" height="12" fill="#D4AF37"/>
      <rect x="20" width="10" height="12" fill="#B5361C"/>
      <rect x="30" width="10" height="12" fill="#1E4E8C"/>
    </pattern>
    <style>
      .tw { animation: twinkle 3.2s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 505px 78px; }
      @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="360" fill="url(#sky)"/>
  <circle cx="505" cy="190" r="270" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#FFF0B3">
    <circle class="tw" cx="90" cy="48" r="1.6"/>
    <circle class="tw" cx="210" cy="40" r="1.2" style="animation-delay:.6s"/>
    <circle class="tw" cx="310" cy="56" r="1.5" style="animation-delay:1.2s"/>
    <circle class="tw" cx="420" cy="38" r="1.2" style="animation-delay:1.8s"/>
    <circle class="tw" cx="600" cy="42" r="1.4" style="animation-delay:.3s"/>
    <circle class="tw" cx="700" cy="56" r="1.2" style="animation-delay:.9s"/>
    <circle class="tw" cx="790" cy="40" r="1.6" style="animation-delay:1.5s"/>
    <circle class="tw" cx="910" cy="50" r="1.3" style="animation-delay:2.1s"/>
    <circle class="tw" cx="960" cy="110" r="1.1" style="animation-delay:2.4s"/>
    <circle class="tw" cx="40" cy="120" r="1.2" style="animation-delay:.2s"/>
  </g>

  <!-- Winged sun disk -->
  <g>
    <g>
      <path d="M485,78 C440,62 390,64 330,80 C372,82 396,86 408,90 C376,92 352,98 338,108 C380,104 430,102 486,92 Z" fill="url(#gold)" stroke="#8A6D1F" stroke-width="1"/>
      <path d="M340,84 C400,80 440,82 484,84 M350,96 C410,92 450,92 484,88" stroke="#8A6D1F" stroke-width="1" fill="none"/>
    </g>
    <g transform="translate(1010 0) scale(-1 1)">
      <path d="M485,78 C440,62 390,64 330,80 C372,82 396,86 408,90 C376,92 352,98 338,108 C380,104 430,102 486,92 Z" fill="url(#gold)" stroke="#8A6D1F" stroke-width="1"/>
      <path d="M340,84 C400,80 440,82 484,84 M350,96 C410,92 450,92 484,88" stroke="#8A6D1F" stroke-width="1" fill="none"/>
    </g>
    <circle class="pulse" cx="505" cy="78" r="19" fill="#C8321B" stroke="#FFD76A" stroke-width="3"/>
  </g>

  <!-- Cartouche -->
  <rect x="270" y="124" width="470" height="96" rx="48" fill="#150D05" fill-opacity="0.72" stroke="#D4AF37" stroke-width="3"/>
  <rect x="277" y="131" width="456" height="82" rx="41" fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="752" y="118" width="7" height="108" rx="3" fill="#D4AF37"/>
  <text x="505" y="187" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="6" fill="url(#gold)">ZEINAB DIAB</text>

  <!-- Subtitle + tagline -->
  <text x="505" y="262" text-anchor="middle" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="5" fill="#E8D9B5">BACKEND &amp; SOFTWARE DEVELOPER</text>
  <text x="505" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#C2A878">Building systems meant to outlast the pyramids</text>

  <!-- Pyramids + dunes -->
  <polygon points="440,334 473,308 506,334" fill="#4A3216"/>
  <polygon points="473,308 506,334 473,334" fill="#35230F"/>
  <polygon points="490,334 530,304 570,334" fill="#5A3E1A"/>
  <polygon points="530,304 570,334 530,334" fill="#3F2A12"/>
  <polygon points="560,334 585,316 610,334" fill="#4A3216"/>
  <path d="M0 348 L0 332 Q 120 320 250 334 Q 380 322 505 334 Q 640 320 760 334 Q 880 322 1000 332 L1000 348 Z" fill="#2A1B0B"/>

  <!-- Ramses II bust (stylized) -->
  <g transform="translate(140 175) scale(0.8)">
    <!-- collar -->
    <path d="M -72,76 Q 0,150 72,76 L 86,102 Q 0,190 -86,102 Z" fill="#B5361C" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M -62,78 Q 0,138 62,78 L 72,96 Q 0,170 -72,96 Z" fill="#0F8B7D"/>
    <path d="M -50,80 Q 0,122 50,80 L 58,92 Q 0,150 -58,92 Z" fill="#D4AF37"/>
    <!-- nemes headdress -->
    <path d="M -58,-44 Q 0,-92 58,-44 L 66,78 L 38,78 L 37,-18 L -37,-18 L -38,78 L -66,78 Z" fill="url(#nemes)" stroke="#D4AF37" stroke-width="2"/>
    <!-- face -->
    <path d="M -35,-20 Q 0,-28 35,-20 L 33,28 Q 28,58 0,62 Q -28,58 -33,28 Z" fill="#C98B3A" stroke="#8A5A1C" stroke-width="1.5"/>
    <!-- eyes, brows, kohl -->
    <path d="M -24,2 Q -15,-6 -6,2 Q -15,7 -24,2 Z" fill="#120A04"/>
    <path d="M 6,2 Q 15,-6 24,2 Q 15,7 6,2 Z" fill="#120A04"/>
    <path d="M -24,2 L -34,5 M 24,2 L 34,5" stroke="#120A04" stroke-width="2" stroke-linecap="round"/>
    <path d="M -28,-8 Q -15,-14 -4,-8 M 4,-8 Q 15,-14 28,-8" stroke="#120A04" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- nose + mouth -->
    <path d="M 0,6 L -4,28 Q 0,31 4,28 Z" fill="#B8742A"/>
    <path d="M -10,42 Q 0,47 10,42" stroke="#6B3A12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- uraeus -->
    <path d="M 0,-20 C -7,-28 -5,-40 0,-46 C 5,-40 7,-28 0,-20 Z" fill="url(#gold)" stroke="#8A6D1F" stroke-width="1"/>
    <circle cx="0" cy="-40" r="3.5" fill="#D4AF37"/>
    <!-- ceremonial beard -->
    <path d="M -7,62 L 7,62 L 10,104 Q 0,110 -10,104 Z" fill="#1E4E8C" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M -8,74 H 8 M -9,86 H 9 M -9.5,98 H 9.5" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  <text x="140" y="318" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" letter-spacing="3" fill="#D4AF37">RAMSES II</text>

  <!-- Eye of Horus (Udjat) -->
  <g transform="translate(860 182) scale(1.05)">
    <circle cx="6" cy="10" r="78" fill="none" stroke="#30D5C8" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M -62,-30 Q -8,-64 56,-36" stroke="#D4AF37" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M -66,2 Q -10,-34 52,-8 Q 10,24 -66,2 Z" fill="#F5E2A0" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-6" cy="-2" r="12" fill="#1E4E8C" stroke="#120A04" stroke-width="2"/>
    <circle cx="-6" cy="-2" r="5" fill="#120A04"/>
    <path d="M 52,-8 Q 72,-6 80,6" stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -26,20 L -26,50 Q -26,64 -44,64" stroke="#D4AF37" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 10,18 Q 40,32 62,30 Q 82,30 82,48 Q 82,62 66,62 Q 54,62 54,50" stroke="#D4AF37" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="860" y="318" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" letter-spacing="3" fill="#D4AF37">EYE OF HORUS</text>

  <!-- Frame + color bands -->
  <rect x="14" y="26" width="972" height="308" rx="4" fill="none" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect y="0" width="1000" height="12" fill="url(#band)"/>
  <rect y="12" width="1000" height="2" fill="#D4AF37"/>
  <rect y="346" width="1000" height="2" fill="#D4AF37"/>
  <rect y="348" width="1000" height="12" fill="url(#band)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
