<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Zeinab Diab - animated cartoon banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0F3D66"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10233F"/>
      <stop offset="1" stop-color="#0A172B"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C9FF"/>
      <stop offset="1" stop-color="#FFC107"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .o{transform-box:fill-box;transform-origin:center}
    .tw{animation:tw 2.6s ease-in-out infinite}
    .cloud{animation:drift 45s linear infinite}
    .sway{animation:sway 3.2s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
    .hand{animation:tap .5s ease-in-out infinite}
    .ln{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:type 7s ease-in-out infinite}
    .cur{animation:cur 1s steps(1) infinite}
    .steam{animation:steam 2.4s ease-in-out infinite}
    .bub{animation:float 4s ease-in-out infinite}
    .in{opacity:0;animation:slide .9s ease-out forwards}
    .pill{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,float 3.5s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:spark 2s ease-in-out infinite}
    .wave{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 3s ease-in-out infinite}

    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1060px)}}
    @keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
    @keyframes type{0%{transform:scaleX(0)}35%{transform:scaleX(1)}80%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    @keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
    @keyframes spark{0%,100%{transform:scale(.5) rotate(0)}50%{transform:scale(1.2) rotate(45deg)}}
    @keyframes draw{0%{stroke-dashoffset:100}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g fill="#FFFFFF">
      <circle class="tw" cx="30" cy="30" r="2" style="animation-delay:0s"/>
      <circle class="tw" cx="120" cy="22" r="1.6" style="animation-delay:.6s"/>
      <circle class="tw" cx="300" cy="28" r="2" style="animation-delay:1.1s"/>
      <circle class="tw" cx="420" cy="52" r="1.6" style="animation-delay:.3s"/>
      <circle class="tw" cx="520" cy="24" r="2" style="animation-delay:1.7s"/>
      <circle class="tw" cx="640" cy="40" r="1.6" style="animation-delay:.9s"/>
      <circle class="tw" cx="760" cy="26" r="2" style="animation-delay:1.4s"/>
      <circle class="tw" cx="870" cy="50" r="1.6" style="animation-delay:.2s"/>
      <circle class="tw" cx="560" cy="310" r="1.6" style="animation-delay:1.2s"/>
      <circle class="tw" cx="700" cy="300" r="2" style="animation-delay:.5s"/>
      <circle class="tw" cx="850" cy="305" r="1.6" style="animation-delay:1.9s"/>
      <circle class="tw" cx="430" cy="300" r="2" style="animation-delay:.8s"/>
    </g>

    <!-- drifting clouds -->
    <g transform="translate(0,70)">
      <g class="cloud" opacity=".14" fill="#FFFFFF" style="animation-delay:-8s">
        <circle cx="0" cy="0" r="16"/><circle cx="22" cy="-9" r="21"/><circle cx="46" cy="0" r="15"/>
        <rect x="-12" y="0" width="70" height="15" rx="7"/>
      </g>
    </g>
    <g transform="translate(0,250)">
      <g class="cloud" opacity=".1" fill="#FFFFFF" style="animation-delay:-28s">
        <circle cx="0" cy="0" r="14"/><circle cx="20" cy="-8" r="18"/><circle cx="40" cy="0" r="13"/>
        <rect x="-10" y="0" width="62" height="13" rx="6"/>
      </g>
    </g>

    <!-- floor -->
    <rect y="276" width="900" height="64" fill="#0A1830"/>

    <!-- floating code bubbles -->
    <g font-size="14" font-weight="800" text-anchor="middle">
      <g class="bub" style="animation-delay:0s">
        <circle cx="48" cy="76" r="24" fill="#00C9FF" fill-opacity=".15" stroke="#00C9FF" stroke-width="2"/>
        <text x="48" y="81" fill="#00C9FF">{ }</text>
      </g>
      <g class="bub" style="animation-delay:.8s">
        <circle cx="232" cy="52" r="24" fill="#FF9800" fill-opacity=".15" stroke="#FF9800" stroke-width="2"/>
        <text x="232" y="57" fill="#FF9800">SQL</text>
      </g>
      <g class="bub" style="animation-delay:1.6s">
        <circle cx="338" cy="96" r="22" fill="#FFC107" fill-opacity=".15" stroke="#FFC107" stroke-width="2"/>
        <text x="338" y="101" fill="#FFC107">AI</text>
      </g>
      <g class="bub" style="animation-delay:2.2s">
        <circle cx="46" cy="176" r="22" fill="#FF5252" fill-opacity=".15" stroke="#FF5252" stroke-width="2"/>
        <text x="46" y="181" fill="#FF5252">PY</text>
      </g>
      <g class="bub" style="animation-delay:1.2s">
        <circle cx="392" cy="40" r="20" fill="#00C9FF" fill-opacity=".15" stroke="#00C9FF" stroke-width="2"/>
        <text x="392" y="45" font-size="12" fill="#00C9FF">&lt;/&gt;</text>
      </g>
    </g>

    <!-- character: body + head (swaying) -->
    <g class="sway">
      <!-- bun -->
      <circle cx="140" cy="106" r="15" fill="#2B1B17"/>
      <!-- body -->
      <rect x="96" y="190" width="88" height="86" rx="30" fill="#FF9800"/>
      <path d="M130,196 L130,216 M150,196 L150,214" stroke="#FFF3E0" stroke-width="3" stroke-linecap="round"/>
      <!-- neck -->
      <rect x="130" y="178" width="20" height="16" fill="#F2B88F"/>
      <!-- head -->
      <circle cx="140" cy="150" r="38" fill="#FFCBA4"/>
      <!-- hair cap -->
      <path d="M102,150 C98,106 182,106 178,150 C168,128 112,128 102,150 Z" fill="#2B1B17"/>
      <!-- headphones -->
      <path d="M100,152 C96,98 184,98 180,152" fill="none" stroke="#00C9FF" stroke-width="7" stroke-linecap="round"/>
      <rect x="91" y="142" width="15" height="30" rx="7" fill="#FF5252"/>
      <rect x="174" y="142" width="15" height="30" rx="7" fill="#FF5252"/>
      <!-- eyes (looking at the screen) -->
      <g class="eye">
        <ellipse cx="126" cy="154" rx="6" ry="7" fill="#FFFFFF"/>
        <circle cx="128.5" cy="155" r="3.8" fill="#1A1A1A"/>
        <circle cx="129.6" cy="153.6" r="1.2" fill="#FFFFFF"/>
      </g>
      <g class="eye">
        <ellipse cx="154" cy="154" rx="6" ry="7" fill="#FFFFFF"/>
        <circle cx="156.5" cy="155" r="3.8" fill="#1A1A1A"/>
        <circle cx="157.6" cy="153.6" r="1.2" fill="#FFFFFF"/>
      </g>
      <path d="M120,141 Q126,137 132,140 M148,140 Q154,137 160,141" fill="none" stroke="#2B1B17" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="118" cy="168" r="5" fill="#FF8A80" fill-opacity=".55"/>
      <circle cx="162" cy="168" r="5" fill="#FF8A80" fill-opacity=".55"/>
      <path d="M131,168 Q140,178 150,168" fill="none" stroke="#7A3E2B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- desk -->
    <rect x="50" y="262" width="350" height="14" rx="7" fill="#D9822B"/>
    <rect x="70" y="276" width="10" height="64" fill="#B8691C"/>
    <rect x="370" y="276" width="10" height="64" fill="#B8691C"/>

    <!-- arms + hands -->
    <path d="M104,214 Q88,236 100,252" fill="none" stroke="#FF9800" stroke-width="18" stroke-linecap="round"/>
    <circle cx="101" cy="255" r="9" fill="#FFCBA4"/>
    <path d="M178,214 Q214,226 236,250" fill="none" stroke="#FF9800" stroke-width="18" stroke-linecap="round"/>
    <circle class="hand" cx="240" cy="253" r="9" fill="#FFCBA4"/>

    <!-- mug + steam -->
    <rect x="58" y="236" width="24" height="26" rx="5" fill="#FF5252"/>
    <path d="M82,242 Q96,244 82,257" fill="none" stroke="#FF5252" stroke-width="4" stroke-linecap="round"/>
    <path class="steam" d="M65,232 Q61,224 65,216" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" style="animation-delay:0s"/>
    <path class="steam" d="M75,232 Q71,224 75,216" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" style="animation-delay:1.2s"/>

    <!-- laptop -->
    <path d="M222,262 L378,262 L368,252 L232,252 Z" fill="#C5D3E6"/>
    <rect x="236" y="150" width="130" height="102" rx="8" fill="#E3ECF7"/>
    <rect x="242" y="156" width="118" height="90" rx="4" fill="url(#screen)"/>
    <rect class="ln" x="250" y="166" width="70" height="7" rx="3.5" fill="#00C9FF" style="animation-delay:0s"/>
    <rect class="ln" x="258" y="180" width="90" height="7" rx="3.5" fill="#FFC107" style="animation-delay:.5s"/>
    <rect class="ln" x="258" y="194" width="50" height="7" rx="3.5" fill="#FF9800" style="animation-delay:1s"/>
    <rect class="ln" x="250" y="208" width="80" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".85" style="animation-delay:1.5s"/>
    <rect class="ln" x="258" y="222" width="60" height="7" rx="3.5" fill="#FF5252" style="animation-delay:2s"/>
    <rect class="cur" x="250" y="236" width="6" height="8" fill="#00C9FF"/>

    <!-- sparkles -->
    <g transform="translate(862,112)"><path class="spark" d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z" fill="#FFC107"/></g>
    <g transform="translate(832,62)"><path class="spark" style="animation-delay:.8s" d="M0,-9 L3,-3 L9,0 L3,3 L0,9 L-3,3 L-9,0 L-3,-3 Z" fill="#00C9FF"/></g>
    <g transform="translate(560,70)"><path class="spark" style="animation-delay:1.3s" d="M0,-8 L2.5,-2.5 L8,0 L2.5,2.5 L0,8 L-2.5,2.5 L-8,0 L-2.5,-2.5 Z" fill="#FF9800"/></g>

    <!-- text -->
    <g>
      <text class="in" x="452" y="108" font-size="22" font-weight="700" fill="#00C9FF" style="animation-delay:.2s">Hi, I'm</text>
      <text class="in" x="450" y="164" font-size="58" font-weight="800" fill="url(#txt)" style="animation-delay:.5s">Zeinab Diab</text>
      <path class="wave" pathLength="100" d="M452,180 q14,-10 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0" fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>
      <text class="in" x="452" y="212" font-size="20" font-weight="700" fill="#FFC107" style="animation-delay:.9s">Backend Developer • Competitive Programmer</text>
      <text class="in" x="452" y="238" font-size="16" fill="#9FB6D0" style="animation-delay:1.2s">CS &amp; AI Student — Information Systems</text>
    </g>

    <!-- pills -->
    <g font-size="14" font-weight="800" text-anchor="middle" fill="#0B1F3A">
      <g class="pill" style="animation-delay:1.4s,2s">
        <rect x="452" y="256" width="150" height="34" rx="17" fill="#FF9800"/>
        <text x="527" y="278">2x ECPC Finalist</text>
      </g>
      <g class="pill" style="animation-delay:1.6s,2.4s">
        <rect x="614" y="256" width="130" height="34" rx="17" fill="#00C9FF"/>
        <text x="679" y="278">2000+ Solved</text>
      </g>
      <g class="pill" style="animation-delay:1.8s,2.8s">
        <rect x="756" y="256" width="124" height="34" rx="17" fill="#FFC107"/>
        <text x="818" y="278">Rating 1900</text>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
